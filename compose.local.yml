name: dictionary-glm-local

services:
  db:
    image: postgres:15

    environment:
      POSTGRES_DB: dictionary
      POSTGRES_USER: dictapp
      POSTGRES_PASSWORD: dictapp_local_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dictapp -d dictionary"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
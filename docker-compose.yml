services:
  web:
    build: .
    container_name: dict_web
    command: uvicorn dictapp.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    depends_on:
      - db
      - ollama
    restart: always

  db:
    image: postgres:15
    container_name: dict_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dict_pg_data:/var/lib/postgresql/data
    restart: always

  ollama:
    image: ollama/ollama
    container_name: dict_ollama
    ports:
      - "11434:11434"
    volumes:
      - /root/.ollama:/root/.ollama
    restart: always

volumes:
  dict_pg_data:
  ollama_data:

